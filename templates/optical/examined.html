{% csrf_token %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .upload-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .upload-container h2 {
            margin-bottom: 15px;
            color: #333;
        }
        .file-input {
            display: none;
        }
        .upload-label {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-label:hover {
            background-color: #0056b3;
        }
        .preview {
            margin-top: 15px;
            max-width: 400px;
            height: auto;
            display: none;
            border-radius: 5px;
        }
        .text-input {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .submit-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h2>Upload an Image</h2>
        <form id="uploadForm" action="/app/process/" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" id="fileInput" class="file-input" name="image" accept="image/jpeg, image/jpg, image/png">
            <label for="fileInput" class="upload-label">Choose Image</label>
            <br>
            <img id="imagePreview" class="preview">
            <br>
            <input type="text" name="key" class="text-input" placeholder="کلید را وارد کنید">
            <br>
            <br>
            <button type="submit" class="submit-btn">Upload</button>
        </form>
        
        <h2>Correct Answers: <span id="correct-answers">{{ correct }}</span></h2>
        <h2>Wrong Answers: <span id="wrong-answers">{{ wrong }}</span></h2>
        <h2>Not Answered: <span id="not-answered">{{ not_answer }}</span></h2>
        <h2>Percentage: <span id="percentage">{{ percent }}%</span></h2>
    </div>
    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
