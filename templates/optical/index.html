<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload & Preview Images</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        /* Input Fields */
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input[type="file"], input[type="text"], select {
            display: block;
            width: 100%;
            padding: 12px; /* Increased padding for better spacing */
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            font-size: 16px;
            box-sizing: border-box; /* Ensures padding is inside the element width */
        }

        /* Image Preview Column */
        .image-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            gap: 25px; /* More space between images */
        }

        .image-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 10px; /* More space between image and dropdowns */
        }

        img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        /* Submit Button */
        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            border: none;
            background-color: #28a745;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        {% if error %}
            <h1>Error</h1>
        {% endif %}
        <h2>Upload, Preview & Select Object</h2>

        <form id="imageForm" action="/app/process/" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Category Selection -->
            <div class="form-group">
                <label for="category">دپارتمان:</label>
                <select id="category" name="category">
                    {% for department in departments %}
                        <option value="{{ department.id }}">{{ department.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Text Field -->
            <div class="form-group">
                <label for="description">Additional Info:</label>
                <input type="text" id="description" name="key" placeholder="کلید را وارد کنید.">
            </div>

            <!-- File Upload -->
            <div class="form-group">
                <label for="imageInput">Upload Images:</label>
                <input type="file" id="imageInput" name="images" multiple accept="image/*">
            </div>

            <!-- Image Preview -->
            <div class="image-preview" id="previewContainer"></div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById("imageInput").addEventListener("change", function(event) {
            const previewContainer = document.getElementById("previewContainer");
            previewContainer.innerHTML = ""; // Clear previous previews

            const files = event.target.files;
            if (files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = function(e) {
                    const imageItem = document.createElement("div");
                    imageItem.classList.add("image-item");

                    // Create image preview
                    const img = document.createElement("img");
                    img.src = e.target.result;
                    img.alt = "Selected Image";

                    // Create dropdown menu for objects
                    const select = document.createElement("select");
                    select.name = `object_${i}`; // Give each select a unique name
                    console.log(document.getElementById("category").value)
                    updateObjectDropdown(select, document.getElementById("category").value);

                    // Append image and dropdown to container
                    imageItem.appendChild(img);
                    imageItem.appendChild(select);
                    previewContainer.appendChild(imageItem);
                };

                reader.readAsDataURL(file); // Convert file to base64 for preview
            }
        });

        // Update all dropdowns when category changes
        document.getElementById("category").addEventListener("change", function() {
            const selects = document.querySelectorAll(".image-item select");
            selects.forEach(select => {
                updateObjectDropdown(select, this.value);
            });
        });

        // Function to update object dropdown based on category
        function updateObjectDropdown(select, category) {
            select.innerHTML = ""; // Clear previous options
            console.log(category)
            {% for student in students %}
                if(category === "{{ student.department.id }}") {
                    console.log("hi")
                    const option = document.createElement("option");
                    option.value = "{{ student.id }}";
                    option.textContent = "{{ student.first_name }} {{ student.last_name }}";
                    select.appendChild(option);
                }
            {% endfor %}
        }
        /*
        function updateObjectDropdown(select, category) {
            select.innerHTML = ""; // Clear previous options
            categoryObjects[category].forEach(obj => {
                const option = document.createElement("option");
                option.value = obj;
                option.textContent = obj;
                select.appendChild(option);
            });
        }
        */
    </script>

</body>
</html>
